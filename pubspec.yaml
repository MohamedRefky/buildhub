name: buildhub
description: "BuildHub UAE / OrionB - Flutter port of the native Kotlin app. Intelligent OS for Construction."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  # Firebase (mirrors google-services + firebase-bom in app/build.gradle.kts)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  # Gemini AI (mirrors libs.firebase.ai / GeminiApiClient.kt)
  google_generative_ai: ^0.4.6
  # Location (mirrors FusedLocationProvider in MainActivity.kt)
  geolocator: ^13.0.4
  # QR (mirrors QrCodeScannerScreen + SafetyQrPassport)
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  # Local DB (mirrors Room)
  sqflite: ^2.4.1
  # Utils
  uuid: ^4.5.1
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
